{% extends 'base.html' %}

{% block content %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Alertas</title>
    <style>
        
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 600px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
        }

        .card p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>

<body>
  <div class="container align-text-top mt-5">
    <h1>📢 History of alerts</h1>
    <p>Bellow you can see all the alerts registered in the system...</p>
    <div id="alertas-container" class="cards-container"></div>
    <div style="height: 50px;"></div> 
  </div>

  <script>
    let cantidadAnterior = 0;

    function notificarNuevaAlerta(nuevaCantidad) {
      if (nuevaCantidad > cantidadAnterior) {
        // ⚠️ Hay nuevas alertas
        alert("⚠️¡New alert!");
        // También puedes reproducir un sonido, cambiar el título, o mostrar un badge
      }

      cantidadAnterior = nuevaCantidad; // Actualizar
    }

    function actualizarAlertas() {
      fetch("/api/alerts/")
        .then(response => response.json())
        .then(data => {

          let cantidad = data.length; 

          notificarNuevaAlerta(cantidad);
              
          let container = document.getElementById("alertas-container");
          container.innerHTML = ""; // Limpiar
  
          data.forEach(alerta => {
            let div = document.createElement("div");
            div.classList.add("card");
            div.innerHTML = `
              <p><strong> Estado:</strong> ${alerta.estado}</p>
              <p><strong> Descripción:</strong> ${alerta.descripción}</p>
              <p><strong> Mensaje:</strong> ${alerta.mensaje}</p>
              <p><strong> Fecha:</strong> ${alerta.fecha}</p>
            `;
            container.appendChild(div);
          });
        })
        .catch(error => {
          console.error("Error loading alerts:", error);
        });
    }
  
    setInterval(actualizarAlertas, 5000);
    actualizarAlertas();
  </script>
  

    <!--
    {% if alertas %}
    <div class="cards-container">
        {% for alerta in alertas %}
            <div class="card">
                {% for clave, valor in alerta.items %}
                    {% if forloop.first %}
                        <h3>{{ clave|capfirst }}: {{ valor }}</h3>
                    {% else %}
                        <p><strong>{{ clave|capfirst }}:</strong> {{ valor }}</p>
                    {% endif %}
                {% endfor %}
            </div>
        {% endfor %}
    </div>
    {% else %}
        <p>There are not alerts in the system</p>
    {% endif %}
    
    -->
    
</body>
</html>


  {% endblock content%}
