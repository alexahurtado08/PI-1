{% extends 'base.html' %}

{% block content %}
<h2>Computadoras Registradas</h2>
<table class="table">
    <thead>
        <tr>
            <th>Model</th>
            <th>Purchase Date</th>
            <th>Previous Repairs</th>
        </tr>
    </thead>
    <tbody>
        {% for c in computadoras %}
        <tr>
            <td>{{ c.model }}</td>
            <td>{{ c.purchase_date }}</td>  <!-- campo corregido -->
            <td>{{ c.previous_repairs }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="text-center mt-4">
    <a href="{% url 'registrar_computadora' %}" 
       class="btn btn-success"
       title="Ir al formulario de registro de computadora"
       aria-label="Registrar nueva computadora">
       Registrar nueva computadora
    </a>
</div>
{% endblock %}
