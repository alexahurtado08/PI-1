{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="container align-text-top mt-5">
      <h1><h2>🔐 Manage users</h2></h1>
      <p class="text-secondary">Manage access and security in your system with profiles</p>
      <div style="height: 50px;"></div> 
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Is staff</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.is_staff }}</td>
        <td>
          <form method="POST" action="{% url 'delete_user' u.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
