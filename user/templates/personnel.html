{% extends 'base.html' %} 
{% load static %}

{% block content %}

<div class="container align-text-top mt-5">
    <h1>Authorized Personnel</h1>
    <h2 class="text-secondary">
        Below is a list of all personnel authorized to freely move the university's computers
    </h2>
    <div style="height: 50px;"></div> 
</div>

<div class="container">
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for persona in personal %}
        <div class="col">
            <div class="card" style="width: 18rem;">
                <img src="{{ persona.foto.url }}" class="card-img-top img-fluid" alt="Picture of {{ persona.nombre }}">
                <div class="card-body">
                    <h5 class="card-title">Picture of {{ persona.nombre }}</h5>
                </div>
            </div>        
        </div>
        {% endfor %}
    </div>
</div>

{% endblock content %}
